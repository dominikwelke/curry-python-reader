[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "curry-python-reader"
version = "0.0.1"
authors = [
  { name="Fernando Gasca", email="fgasca@neuroscan.com" },
]
maintainers = [
  { email = "dan@mccloy.info", name = "Dan McCloy" },
]
description = "Python reader for CURRY MEG/EEG files"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    'Topic :: Software Development',
    'Topic :: Scientific/Engineering',
]
dependencies = [
    "certifi>=2020.6.20",
    "cycler>=0.10.0",
    "kiwisolver>=1.2.0",
    "matplotlib>=3.3.2",
    "numpy>=1.19.2",
    "Pillow>=8.0.1",
    "pip>=21.0.1",
    "pyparsing>=2.4.7",
    "python-dateutil>=2.8.1",
    "setuptools>=50.3.2",
    "six>=1.15.0",
]
license = 'BSD-3-Clause'
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://compumedicsneuroscan.com/products/by-name/curry/"
Issues = "https://github.com/neuroscan/curry-python-reader/issues"